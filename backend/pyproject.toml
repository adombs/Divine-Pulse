[project]
name = "divine-pulse"
version = "1.2.6"
description = "Tracks Fire Emblem: Three Houses units and battles by reading the game's memory in the emulator"
requires-python = ">=3.12"
# Dependencies are pinned in requirements.txt / requirements-dev.txt.

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E501: long strings and comments are fine. B008: FastAPI's Depends()/Query() defaults.
# B904/B905/UP017: style, not bugs here.
ignore = ["E501", "B008", "B904", "B905", "UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
