# Protection test, not for merging: Actions policy must refuse a pinned action from outside GitHub.
name: zz policy third party
on: pull_request
permissions:
  contents: read
jobs:
  thirdparty:
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e
        with:
          issue-number: 1
