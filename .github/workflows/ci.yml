# The checks from .github/CONTRIBUTING.md, on the oldest and the recommended supported versions, on Windows and macOS,
# and a release build on each (the files tools/release.py finalize would upload). Both systems run the same steps;
# the only system-specific one is allowing developer tools on macOS. No game files needed.
# Pull requests from forks run with a read-only token and no secrets. Don't switch this to pull_request_target, which
# would run contributors' code with access to this repository.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**", "hotfix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The Windows names stay as they are: main's ruleset requires "checks (Python 3.12, Node 22.12.0)" and
    # "checks (Python 3.14, Node 24)".
    name: checks (${{ matrix.label }}Python ${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: ""
            python: "3.12"
            node: "22.12.0"
          - os: windows-latest
            label: ""
            python: "3.14"
            node: "24"
          - os: macos-latest
            label: "macOS, "
            python: "3.12"
            node: "22.12.0"
          - os: macos-latest
            label: "macOS, "
            python: "3.14"
            node: "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: python -m ruff check --config pyproject.toml . ../tools ../packaging
      - name: Layer check
        working-directory: backend
        run: python -B architecture.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      # The build's tsc -b checks types too; this says so on its own line when they're what fails.
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      # The macOS memory reader's tests open a real process; without this, macOS waits on a password prompt.
      - name: Allow developer tools (macOS)
        if: runner.os == 'macOS'
        run: sudo DevToolsSecurity -enable
      # After the build: the API tests serve frontend/dist. Includes the game-content guard.
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

  release-build:
    # The same steps on each system, as tools/release.py finalize runs them (the tests ran above): tools/build.py
    # (Windows: the portable zip and the installer; macOS: the signed app and its zip, each opened once with
    # --check-desktop from a copy made to look downloaded), release.py's checks of the files, a smoke test of the
    # zip (tools/smoke_app.py), and the files kept for a week to try out.
    name: release build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build
        run: python tools/build.py --skip-tests
      # What finalize checks before uploading: this system's release files (Windows: the portable zip and the
      # installer; macOS: the app zip), their lines in SHA256SUMS.txt, and the zip's game-content scan.
      - name: Release checks
        run: python tools/release.py check
      # The release zip unzipped as a download ends up (Windows: Internet-zone markers on the DLLs; macOS: read-only,
      # as App Translocation runs it) and started with a new data folder: the program's own files (Windows: the CLR
      # settings and NSTool; macOS: the signature and the memory reader's entitlement), the server, the page and a
      # picture, the window loading the page, and a clean quit. The runners have a desktop session, so the window
      # really opens.
      - name: Smoke test the release
        id: smoke
        run: python tools/smoke_app.py --port 8799
      # Kept when only the smoke test failed too, to try the build by hand.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || steps.smoke.outcome == 'failure'
        with:
          name: divine-pulse-${{ matrix.label }}
          path: |
            release/Divine-Pulse-*.zip
            release/Divine-Pulse-*-setup.exe
            release/SHA256SUMS.txt
          retention-days: 7
          if-no-files-found: error
