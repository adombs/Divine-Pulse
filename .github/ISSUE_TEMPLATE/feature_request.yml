name: Feature request
description: Suggest something Divine Pulse could do
labels: [enhancement, needs triage]
body:
  - type: markdown
    attributes:
      value: |
        Name the title after the change, starting with a verb: "Add a filter for units in reserve". Please don't attach game files, dumps, keys or memory captures.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: What you want to do while playing or looking back at a run, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like to happen
      description: How it could work. A rough idea is fine.
    validations:
      required: true
